# Temporary Phase 1+3 verification for the IPv6-prefix-filter fork.
# Runs the shared-logic/protocol host C tests + the Rust protocol/activator
# crates + the lsposed Kotlin unit tests on stock ubuntu runners (gcc, cargo,
# JDK, Android SDK all preinstalled or fetched) — no CI container image needed,
# so it works on a fork where ghcr.io/<owner>/vpnhide/ci does not exist.
# NOT for upstream: excluded from the PR.
name: prefix-phase1-check

on:
  workflow_dispatch:
  push:
    branches: [feat/ipv6-prefix-filter]

jobs:
  phase1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: C host tests (shared-logic + protocol vectors)
        run: |
          set -euxo pipefail
          cd kmod/shared
          gcc -O2 -Wall -Wextra -Werror -I.. -o /tmp/test_vpnhide_logic test_vpnhide_logic.c
          /tmp/test_vpnhide_logic
          gcc -O2 -Wall -Wextra -Werror -I.. -o /tmp/test_protocol test_protocol.c
          /tmp/test_protocol protocol_vectors.tsv

      - name: rustfmt (protocol + activator crates)
        run: cargo fmt --check -p vpnhide_protocol -p vpnhide_protocol_diff -p vpnhide_activator

      - name: clippy (protocol + activator crates, -D warnings)
        run: cargo clippy -p vpnhide_protocol -p vpnhide_protocol_diff -p vpnhide_activator --all-targets -- -D warnings

      - name: cargo test (protocol + diff oracle + activator)
        run: cargo test -p vpnhide_protocol -p vpnhide_protocol_diff -p vpnhide_activator

  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Pinned to KTLINT_VERSION in .github/docker/ci/Dockerfile (the stock
      # ci.yml runs the same binary inside its private image).
      - name: ktlint 1.8.0
        run: |
          set -euxo pipefail
          curl -fsSL -o ktlint https://github.com/pinterest/ktlint/releases/download/1.8.0/ktlint
          chmod +x ktlint
          ./ktlint "lsposed/app/src/**/*.kt"

      # The app's buildRustProbe gradle task shells out to `cargo ndk`; mirror
      # the proven prefix-kmod-build.yml activator recipe so unit-test
      # configuration succeeds on a bare runner.
      - name: Rust target + cargo-ndk
        run: |
          set -euxo pipefail
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked

      - name: Android SDK platform (compileSdk 37)
        run: |
          set -euxo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # (yes || true): under pipefail, plain `yes` dies with SIGPIPE (141)
          # once sdkmanager stops reading and would fail the step; the subshell
          # swallows it so the pipeline exit status stays sdkmanager's own.
          (yes || true) | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" --list_installed | grep -q "platforms;android-37" || "$SDKMANAGER" "platforms;android-37"

      - name: Cache gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('lsposed/gradle/wrapper/gradle-wrapper.properties', 'lsposed/**/build.gradle.kts') }}

      # Fork gate: detekt + unit tests (incl. the shared golden vectors).
      # cpdCheck + lintDebug stay with upstream CI at PR time.
      - name: detekt + Kotlin unit tests
        run: |
          set -euxo pipefail
          export ANDROID_NDK_HOME="${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}"
          echo "Using NDK at $ANDROID_NDK_HOME"
          cd lsposed
          ./gradlew :app:detekt :app:testDebugUnitTest
